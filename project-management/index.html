// Deal math for a project + its expense totals by category
function calcDeal(p, byCat) {
  byCat = byCat || {};
  const nonRehab = CONFIG.nonRehabCategories;
  let rehabSpent = 0, closing = 0, carrying = 0, selling = 0, totalSpent = 0;
  Object.keys(byCat).forEach((cat) => {
    const v = num(byCat[cat]);
    totalSpent += v;
    if (nonRehab.indexOf(cat) === -1) rehabSpent += v;
    if (cat === "Closing Costs") closing += v;
    if (cat === "Carrying Costs") carrying += v;
    if (cat === "Selling Costs") selling += v;
  });
  const purchase = num(p.purchasePrice), budget = num(p.rehabBudget), arv = num(p.arv), loan = num(p.loanAmount);
  const projRehab = Math.max(budget, rehabSpent);
  const estSelling = Math.max(arv * CONFIG.sellingCostPct, selling);
  const allIn = purchase + projRehab + closing + carrying + estSelling;
  const profit = arv > 0 ? arv - allIn : 0;
  const cashIn = Math.max(0, purchase + projRehab + closing + carrying - loan);
  return { purchase, budget, arv, loan, rehabSpent, closing, carrying, selling, estSelling, projRehab, allIn, profit, totalSpent,
           remaining: budget - rehabSpent, roi: allIn > 0 ? (profit / allIn) * 100 : 0, cashIn };
}
const calcMAO = (arv, repairs) => num(arv) * CONFIG.maoPercent - num(repairs);

let SESSION_PIN = "";
let onSessionExpired = null;   // set by App: kicks back to the PIN screen if the PIN was reset elsewhere
// Same rules the server enforces — checked here first for instant feedback
function pinProblem(next, current) {
  next = String(next || "");
  if (!/^\d{4,8}$/.test(next)) return "PIN must be 4–8 digits.";
  if (current && next === String(current)) return "Choose a PIN different from the current one.";
  if (/^(\d)\1+$/.test(next) || "0123456789".indexOf(next) >= 0 || "9876543210".indexOf(next) >= 0) return "Too easy to guess — avoid repeated or sequential digits.";
  return "";
}
async function api(action, extra) {
  extra = extra || {};
  if (DEMO) return demoApi(action, extra);
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(Object.assign({ pin: SESSION_PIN, action: action }, extra)) });
  let data;
  try { data = await res.json(); } catch (err) { throw new Error("Server returned an unexpected response"); }
  if (data && data.error) {
    if ((data.error === "Unauthorized" || data.error === "PIN_RESET_REQUIRED") && action !== "auth" && action !== "changePin" && onSessionExpired) onSessionExpired();
    throw new Error(data.error);
  }
  return data;
}

const PRIORITY_RANK = (p) => { const i = CONFIG.taskPriorities.indexOf(p); return i === -1 ? 0 : i; };
function sortTasks(list) {
  return list.slice().sort((a, b) => {
    const ad = a.status === "Done" ? 1 : 0, bd = b.status === "Done" ? 1 : 0;
    if (ad !== bd) return ad - bd;
    const dd = byDate(a.dueDate, b.dueDate); if (dd) return dd;
    return PRIORITY_RANK(b.priority) - PRIORITY_RANK(a.priority);
  });
}
const nextStatus = (s) => { const L = CONFIG.taskStatuses; const i = L.indexOf(s); return L[(i + 1) % L.length]; };

// ════════════════════════════════════════════════════════════════════
//  APP
// ════════════════════════════════════════════════════════════════════
function App() {
  // ── state (all hooks first) ──
  const [authed, setAuthed] = useState(false);
  const [loginNotice, setLoginNotice] = useState("");
  const [view, setView] = useState("home");
  const [mgmtTab, setMgmtTab] = useState("pipeline");
  const [activeId, setActiveId] = useState(null);
  const [projects, setProjects] = useState([]);
  const [summary, setSummary] = useState({});
  const [expenses, setExpenses] = useState([]);
  const [genExpenses, setGenExpenses] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [quotes, setQuotes] = useState([]);
  const [milestones, setMilestones] = useState({});
  const [vendors, setVendors] = useState({});
  const [vendorCats, setVendorCats] = useState(CONFIG.vendorCategories);
  const [mgmt, setMgmt] = useState({ mgmtTasks: [], mgmtMilestones: [] });
  const [leads, setLeads] = useState([]);
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [busy, setBusy] = useState(0);
  const [booting, setBooting] = useState(false);
  const [projLoading, setProjLoading] = useState(false);
  const [reloadTick, setReloadTick] = useState(0);
  const loadedRef = useRef({ milestones: false, vendors: false, mgmt: false });
  const reqRef = useRef(0);
  const toastTimer = useRef(null);
  const contentRef = useRef(null);

  const toast = (msg, kind) => {
    setToastMsg({ msg, kind });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), kind === "error" ? 4500 : 2200);
  };
  const track = async (p) => { setBusy((b) => b + 1); try { return await p; } finally { setBusy((b) => b - 1); } };

  // ── load core data on auth ──
  const loadSummary = () => api("getSummary").then((r) => setSummary(r.summary || {})).catch(() => {});
  const loadLeads = () => api("getLeads").then((r) => setLeads(r.leads || []));
  const loadCore = async () => {
    setBooting(true);
    try {
      const res = await Promise.all([api("getProjects"), api("getMilestones"), api("getVendors"), api("getMgmtData"), api("getLeads"), api("getSummary")]);
      setProjects(res[0].projects || []);
      setMilestones(res[1].milestones || {}); loadedRef.current.milestones = true;
      const vcats = res[2].categories && res[2].categories.length ? res[2].categories : CONFIG.vendorCategories;
      const vv = res[2].vendors || {};
      Object.keys(vv).forEach((c) => { if (vcats.indexOf(c) === -1) vcats.push(c); });
      setVendors(vv); setVendorCats(vcats); loadedRef.current.vendors = true;
      const md = res[3].data || {};
      setMgmt({ mgmtTasks: md.mgmtTasks || [], mgmtMilestones: md.mgmtMilestones || [] }); loadedRef.current.mgmt = true;
      setLeads(res[4].leads || []);
      setSummary(res[5].summary || {});
    } catch (err) { toast(err.message, "error"); }
    setBooting(false);
  };
  useEffect(() => { if (authed) loadCore(); }, [authed]);

  // ── per-project data ──
  useEffect(() => {
    if (!authed || !activeId) return;
    const my = ++reqRef.current;
    setProjLoading(true);
    Promise.all([api("getExpenses", { projectId: activeId }), api("getTasks", { projectId: activeId }), api("getQuotes", { projectId: activeId })])
      .then((r) => { if (my !== reqRef.current) return; setExpenses(r[0].expenses || []); setTasks(r[1].tasks || []); setQuotes(r[2].quotes || []); })
      .catch((err) => toast(err.message, "error"))
      .then(() => { if (my === reqRef.current) setProjLoading(false); });
  }, [authed, activeId, reloadTick]);

  useEffect(() => {
    if (!authed || view !== "management") return;
    api("getExpenses", { projectId: "general-expenses" }).then((r) => setGenExpenses(r.expenses || [])).catch((err) => toast(err.message, "error"));
  }, [authed, view, reloadTick]);

  useEffect(() => { if (contentRef.current) contentRef.current.scrollTop = 0; }, [view, activeId]);

  // ── navigation ──
  const go = (v) => {
    if (v === "home" || v === "management" || v === "vendors") { setActiveId(null); setExpenses([]); setTasks([]); setQuotes([]); }
    setView(v);
  };
  const openProject = (id) => { setExpenses([]); setTasks([]); setQuotes([]); setActiveId(id); setView("dashboard"); setReloadTick((t) => t + 1); };
  const lock = (notice) => { SESSION_PIN = ""; setModal(null); setLoginNotice(typeof notice === "string" ? notice : ""); setAuthed(false); setActiveId(null); setView("home"); setProjects([]); setLeads([]); };
  onSessionExpired = () => lock("Your PIN was changed. Please sign in again.");
  const openModal = (type, data, projectId) => setModal({ type, data: data || null, projectId: projectId || activeId });
  const closeModal = () => setModal(null);

  // ── persistence helpers ──
  const reloadProject = (pid) => {
    const id = pid || activeId;
    if (id === "general-expenses") api("getExpenses", { projectId: id }).then((r) => setGenExpenses(r.expenses || []));
    if (id && id === activeId) setReloadTick((t) => t + 1);
    loadSummary();
  };
  const saveMilestonesFor = (pid, list) => {
    if (!loadedRef.current.milestones) return Promise.resolve();
    setMilestones((m) => Object.assign({}, m, { [pid]: list }));
    return track(api("saveMilestones", { projectId: pid, milestones: list }));
  };
  const saveVendors = (v, cats) => {
    if (!loadedRef.current.vendors) return Promise.resolve();
    setVendors(v); setVendorCats(cats);
    return track(api("saveVendors", { vendors: v, categories: cats })).catch((err) => toast(err.message, "error"));
  };
  const saveMgmtList = (key, val) => {
    if (!loadedRef.current.mgmt) return Promise.resolve();
    setMgmt((m) => Object.assign({}, m, { [key]: val }));
    return track(api("saveMgmtData", { key, value: val })).catch((err) => toast(err.message, "error"));
  };
  const saveTask = async (t, quiet) => {
    const isNew = !t.id;
    const task = Object.assign({}, t, { id: t.id || genId("t") });
